[package]
name = "spike_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32.2", features = ["cli"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

name: Release

# Pushing a tag vX.Y.Z builds the signed Play bundle and attaches it to a GitHub release (plan 06).
# Uploading it to Play Console stays manual.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: signed app bundle
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match versionName $version in android/app/build.gradle.kts"
            exit 1
          fi
      - name: Server settings
        env:
          SERVER_URL: ${{ vars.WHICHRIDE_SERVER_URL }}
          CLOUD_PROJECT_NUMBER: ${{ vars.WHICHRIDE_CLOUD_PROJECT_NUMBER }}
        run: |
          # Without them the bundle would ship an app that never reaches the server.
          if [[ "$SERVER_URL" != https://* || ! "$CLOUD_PROJECT_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Set variables WHICHRIDE_SERVER_URL (https://…) and WHICHRIDE_CLOUD_PROJECT_NUMBER"
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # No Rust or Gradle cache: a release is built from scratch, never from a cache a branch wrote.
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" > /dev/null
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.WHICHRIDE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret WHICHRIDE_UPLOAD_KEYSTORE_BASE64 is not set (see docs/play/README.md)"
            exit 1
          fi
          base64 --decode <<< "$KEYSTORE_BASE64" > "$RUNNER_TEMP/upload.jks"
      - name: Build
        env:
          WHICHRIDE_UPLOAD_STOREFILE: ${{ runner.temp }}/upload.jks
          WHICHRIDE_UPLOAD_STOREPASSWORD: ${{ secrets.WHICHRIDE_UPLOAD_STORE_PASSWORD }}
          WHICHRIDE_UPLOAD_KEYALIAS: ${{ secrets.WHICHRIDE_UPLOAD_KEY_ALIAS }}
          WHICHRIDE_UPLOAD_KEYPASSWORD: ${{ secrets.WHICHRIDE_UPLOAD_KEY_PASSWORD }}
          SERVER_URL: ${{ vars.WHICHRIDE_SERVER_URL }}
          CLOUD_PROJECT_NUMBER: ${{ vars.WHICHRIDE_CLOUD_PROJECT_NUMBER }}
        run: >-
          ./gradlew --no-daemon --no-build-cache
          -Pwhichride.requireUploadKey=true
          -Pwhichride.serverUrl="$SERVER_URL"
          -Pwhichride.cloudProjectNumber="$CLOUD_PROJECT_NUMBER"
          :app:testReleaseUnitTest :app:bundleRelease
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "whichride-$TAG.aab"
          gh release create "$TAG" "whichride-$TAG.aab" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

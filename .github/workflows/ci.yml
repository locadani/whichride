name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          tags: whichride-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm whichride-server:ci --help

  design:
    name: design tokens · contrast · generated files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: design/.nvmrc
          cache: npm
          cache-dependency-path: design/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run contrast
      - run: npm run build
      - name: generated files are committed and up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- android web)" ]; then
            git status --porcelain -- android web
            echo "::error::Generated files are stale: run 'npm run build' in design/ and commit the result"
            exit 1
          fi

  android:
    name: android (Rust core, designsystem, app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" > /dev/null
      - name: local.properties is never committed
        run: |
          if git ls-files --error-unmatch local.properties > /dev/null 2>&1; then
            echo "::error::android/local.properties is tracked by git; remove it with git rm --cached"
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build logic tests
        run: ./gradlew --no-daemon -p buildSrc test
      - run: >-
          ./gradlew --no-daemon
          :designsystem:testDebugUnitTest :designsystem:lintDebug :designsystem:assembleRelease
          :core:testDebugUnitTest
          :app:testDebugUnitTest :app:lintDebug :app:checkLocalSettings :app:assembleDebug :app:assembleRelease

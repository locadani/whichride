[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
repository = "https://github.com/locadani/whichride"

[workspace.dependencies]
carsharing-core = { path = "crates/core" }
percent-encoding = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

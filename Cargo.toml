[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
repository = "https://github.com/locadani/whichride"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing"] }
base64 = "0.22"
carsharing-core = { path = "crates/core" }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4"
http-body-util = "0.1.5"
percent-encoding = "2"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }
uniffi = "0.32.2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
whichride-ffi = { path = "crates/ffi" }
whichride-server = { path = "crates/server" }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# The Android library (cargo ndk … --profile android): smallest code, still unwinding so a
# core bug becomes a Kotlin exception instead of killing the app.
[profile.android]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
